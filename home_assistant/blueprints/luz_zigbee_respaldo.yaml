blueprint:
  name: Bombilla Zigbee — relé de respaldo, adaptación al volver y temperatura por hora del día
  description: >
    Para una luz cuyo brillo/temperatura de color se controla 100% por
    una bombilla Zigbee (no por `mega_dispositivos`): el relé de
    `mega_dispositivos` deja de ser "lo que enciende la luz" y pasa a
    ser solo un corte de seguridad — garantiza que la bombilla tiene
    corriente. Este blueprint hace tres cosas independientes:

    1. **Pulsador físico fuerza el relé a ON siempre, sin condición**:
    al pulsar el botón (pulsación corta), el relé se enciende SIEMPRE,
    esté como esté (on u off) — no es un toggle. Si el relé se hubiera
    quedado en OFF por lo que sea, pulsar el botón garantiza que la
    bombilla tiene corriente, en vez de depender de que el relé ya
    estuviera en el estado correcto. Esta acción NO toca la bombilla
    Zigbee — nada enciende la luz solo porque HA o MQTT arrancan o se
    reconectan.

    2. **Adaptar la bombilla cuando ella misma vuelve a encenderse**
    (opcional): la propia bombilla Zigbee ya tiene su propio
    comportamiento de recuperación tras un corte (normalmente vuelve a
    su último estado). Cuando HA detecta que esa bombilla pasa a `on`
    por su cuenta, opcionalmente le aplica un brillo/temperatura de
    color por defecto en vez de dejar lo que la bombilla decidiera por
    sí sola.

    3. **Temperatura de color según la hora del día** (opcional,
    independiente de lo anterior): si se activa, cada pocos minutos
    ajusta la temperatura de color de la bombilla según la posición del
    sol — cálida (relax, tipo bombilla incandescente) de noche, neutra/
    fría (más parecida a luz de día) a mediodía. Solo aplica si la
    bombilla está encendida; nunca la enciende ni apaga por sí sola.
    Requiere que la bombilla soporte `color_temp` (no todas las
    bombillas Zigbee regulables lo hacen — algunas son solo brillo).
  domain: automation
  input:
    relay_entity:
      name: Relé (switch en mega_dispositivos)
      selector:
        entity:
          domain: switch
    zigbee_light_entity:
      name: Bombilla Zigbee
      selector:
        entity:
          domain: light
    boton_device_id:
      name: Pulsador (device) que fuerza el relé a ON
      description: >
        El dispositivo MQTT del pulsador físico de esta luz (Ajustes →
        Dispositivos y servicios → MQTT → "Mega Pulsadores A/B").
      selector:
        device:
          integration: mqtt
    boton_subtype:
      name: Subtype del botón
      description: >
        P. ej. "boton_22". Cópialo desde la UI al añadir el disparador
        Device para evitar errores de tecleo.
      selector:
        text: {}
    adaptar_al_volver:
      name: Adaptar brillo/temperatura cuando la bombilla vuelve a encenderse sola
      description: >
        Si se activa, cada vez que la bombilla Zigbee pase a `on` por
        su cuenta (su propio comportamiento tras recuperar corriente),
        se le aplica el brillo de abajo (y la temperatura de color
        correspondiente a la hora actual, si el ciclo automático
        también está activado). Si se desactiva, la bombilla se queda
        en el estado que decida por sí sola.
      default: false
      selector:
        boolean: {}
    brillo_por_defecto_pct:
      name: Brillo por defecto (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    ajustar_temperatura_color:
      name: Ajustar temperatura de color según la hora del día
      description: >
        Activa el ciclo automático de temperatura de color (cálida de
        noche, neutra/fría a mediodía). Pensado para una bombilla IKEA
        TRÅDFRI regulable "WW/CW" (blanco cálido/frío, sin RGB) — su
        rango real de fábrica es aprox. 250-454 mireds (~2200K-4000K),
        más estrecho que otras bombillas Zigbee con RGB. Los valores
        por defecto de abajo ya están dentro de ese rango.
      default: false
      selector:
        boolean: {}
    temp_calida_mireds:
      name: Temperatura cálida (noche/amanecer/atardecer), en mireds
      description: >
        Valor en mireds (no Kelvin — HA usa mireds internamente para
        `color_temp`). Mireds más alto = luz más cálida/anaranjada.
        454 mireds ≈ 2200K, el extremo cálido de fábrica de la IKEA
        TRÅDFRI WW/CW.
      default: 454
      selector:
        number:
          min: 250
          max: 454
    temp_fria_mireds:
      name: Temperatura fría/neutra (mediodía), en mireds
      description: >
        Mireds más bajo = luz más fría/azulada. 250 mireds ≈ 4000K, el
        extremo frío de fábrica de la IKEA TRÅDFRI WW/CW (no llega a
        luz de día fría de verdad, ~6500K — esta bombilla no da tanto).
      default: 250
      selector:
        number:
          min: 250
          max: 454

trigger:
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_short_press
    subtype: !input boton_subtype
    id: pulsador
  - platform: state
    entity_id: !input zigbee_light_entity
    to: "on"
    id: bombilla_encendida
  - platform: time_pattern
    minutes: "/15"
    id: ciclo_temperatura

variables:
  adaptar_al_volver: !input adaptar_al_volver
  brillo_por_defecto_pct: !input brillo_por_defecto_pct
  ajustar_temperatura_color: !input ajustar_temperatura_color
  temp_calida_mireds: !input temp_calida_mireds
  temp_fria_mireds: !input temp_fria_mireds
  zigbee_light_entity: !input zigbee_light_entity
  # Posición del sol 0.0-1.0: 0 = elevación mínima bajo el horizonte
  # (medianoche solar), 1 = elevación máxima (mediodía solar). Usamos
  # sun.sun en vez de la hora del reloj para que el punto más cálido/frío
  # se ajuste solo estación tras estación, sin hardcodear horas.
  elevacion_solar: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
  # Normaliza elevación (-90..90) linealmente a 0..1, con 1 en el punto
  # más alto del sol y 0 en el más bajo (elevación -90 no ocurre nunca
  # en la práctica, pero acota el rango por seguridad).
  factor_dia: "{{ ((elevacion_solar / 90) | max(-1) | min(1) + 1) / 2 }}"
  mireds_objetivo: >-
    {{ (temp_calida_mireds - (temp_calida_mireds - temp_fria_mireds) * factor_dia) | round(0) }}

action:
  - choose:
      # --- Pulsador físico: fuerza el relé a ON siempre, sin condición
      # ni toggle. No toca la bombilla Zigbee, solo garantiza corriente.
      - conditions:
          - condition: trigger
            id: pulsador
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input relay_entity

      # --- La bombilla Zigbee ha vuelto a encenderse por su cuenta
      # (recuperación propia tras un corte, o cualquier otro motivo):
      # opcionalmente se le aplica un brillo/temperatura por defecto.
      - conditions:
          - condition: trigger
            id: bombilla_encendida
          - condition: template
            value_template: "{{ adaptar_al_volver }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input zigbee_light_entity
            data:
              brightness_pct: "{{ brillo_por_defecto_pct }}"
              color_temp: >-
                {{ mireds_objetivo if ajustar_temperatura_color else omit }}

      # --- Ciclo de temperatura de color según la hora del día.
      - conditions:
          - condition: trigger
            id: ciclo_temperatura
          - condition: template
            value_template: "{{ ajustar_temperatura_color }}"
          - condition: state
            entity_id: !input zigbee_light_entity
            state: "on"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input zigbee_light_entity
            data:
              color_temp: "{{ mireds_objetivo }}"
