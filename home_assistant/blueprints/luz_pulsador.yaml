blueprint:
  name: Luz controlada por pulsador físico (corta = toggle, doble = auto-apagado, larga = toggle Area)
  description: >
    Conecta un pulsador físico de `mega_pulsadores` (o
    `mega_pulsadores_low_ram`, ver README principal — ambos firmwares
    envían corta/doble/larga) con una luz de `mega_dispositivos`
    (`HASwitch`, on/off simple, sin brillo/temperatura de color — ver
    README principal del repo).

    - Pulsación corta: apaga/enciende (toggle) SOLO esta luz.
    - Pulsación doble: enciende esta luz y programa apagado automático a
      los N minutos (por defecto 5). Si la luz se apaga manualmente antes
      de que pase ese tiempo, el apagado programado no hace nada raro
      (vuelve a apagar una luz ya apagada, sin efecto visible). Si se
      vuelve a pulsar doble antes de que expire, el temporizador se
      reinicia desde cero (gracias a `mode: restart`).
    - Pulsación larga: TODAS las luces del Area de este pulsador (no la
      del `light_entity` — la del propio dispositivo del pulsador en HA).
      Si alguna está encendida, las apaga todas; si están todas apagadas,
      las enciende todas. Requiere que el device del pulsador y los
      `switch.*` de las luces de esa habitación tengan asignada la misma
      Area en HA (Ajustes → Áreas y zonas) — si el pulsador no tiene Area
      asignada, actúa solo sobre `light_entity` como si fuera pulsación
      corta.

      Además, SOLO en la rama de apagar (había alguna luz encendida),
      cierra también todas las persianas (`cover.*`) de esa misma Area —
      gesto de "buenas noches", apaga y cierra todo de una. Cuando la
      rama es encender luces (estaban todas apagadas), las persianas NO
      se tocan. Si el Area no tiene ninguna persiana, este paso
      simplemente no hace nada (lista vacía, sin error).
  domain: automation
  input:
    boton_device_id:
      name: Pulsador (device)
      description: >
        El dispositivo MQTT del pulsador en HA (Ajustes → Dispositivos y
        servicios → MQTT → "Mega Pulsadores A/B").
      selector:
        device:
          integration: mqtt
    boton_subtype:
      name: Subtype del botón
      description: >
        Identificador del botón, p. ej. "p14" (número de pin — ver
        README principal). Más fiable copiarlo desde la UI al añadir el
        disparador Device en vez de escribirlo a mano.
      selector:
        text: {}
    light_entity:
      name: Luz
      selector:
        entity:
          domain: switch
    auto_apagado_minutos:
      name: Minutos hasta el apagado automático (pulsación doble)
      default: 5
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min

mode: restart

trigger:
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_short_press
    subtype: !input boton_subtype
    id: corta
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_double_press
    subtype: !input boton_subtype
    id: doble
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_long_press
    subtype: !input boton_subtype
    id: larga

variables:
  boton_device_id: !input boton_device_id
  light_entity: !input light_entity
  area_id: "{{ area_id(boton_device_id) }}"
  lights_area: "{{ area_entities(area_id) | select('match', '^switch\\.') | list if area_id else [light_entity] }}"
  covers_area: "{{ area_entities(area_id) | select('match', '^cover\\.') | list if area_id else [] }}"
  hay_alguna_encendida: "{{ lights_area | select('is_state', 'on') | list | count > 0 }}"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: corta
        sequence:
          - service: switch.toggle
            target:
              entity_id: !input light_entity
      - conditions:
          - condition: trigger
            id: doble
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input light_entity
          - delay:
              minutes: !input auto_apagado_minutos
          - service: switch.turn_off
            target:
              entity_id: !input light_entity
      - conditions:
          - condition: trigger
            id: larga
        sequence:
          - service: "switch.{{ 'turn_off' if hay_alguna_encendida else 'turn_on' }}"
            target:
              entity_id: "{{ lights_area }}"
          - if:
              - condition: template
                value_template: "{{ hay_alguna_encendida and covers_area | count > 0 }}"
            then:
              - service: cover.close_cover
                target:
                  entity_id: "{{ covers_area }}"
                continue_on_error: true
