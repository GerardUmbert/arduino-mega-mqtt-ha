blueprint:
  name: Persiana — botón subir/bajar completo (1/2/3/4/5 pulsaciones + larga)
  description: >
    Sustituye a `persiana_pulsador.yaml` cuando quieres aprovechar los 5
    niveles de pulsación de un botón, no solo mantener pulsado. Pensado
    para el patrón de `todo.md`: agrupación de 4 pulsadores por
    habitación, uno hace SIEMPRE de "subir" y otro SIEMPRE de "bajar"
    para todas las persianas de esa agrupación.

    Desde la v2.0.0 se instancia UNA SOLA VEZ por persiana, indicando
    los dos botones de la pareja (subir y bajar) en la misma
    automatización. La dirección se deduce de cuál de los dos ha
    disparado, así que ya no hay input `direccion` ni hace falta crear
    dos automatizaciones por persiana como en la v1.x.

    | Pulsaciones | Botón subir | Botón bajar |
    |---|---|---|
    | 1 | esta persiana → 100%, o PARA si ya se mueve | esta persiana → 0%, o PARA si ya se mueve |
    | 2 | persianas del Area → 100% cada una, o PARA todas si alguna se mueve | persianas del Area → 0% cada una, o PARA todas si alguna se mueve |
    | 3 | esta persiana → 50% | esta persiana → 50% |
    | 4 | esta persiana → posición actual + 5% | esta persiana → posición actual − 5% |
    | 5 | TODAS las persianas de la casa → 100% | TODAS las persianas de la casa → 0% |
    | larga / fin | subir mientras se mantiene, parar al soltar | bajar mientras se mantiene, parar al soltar |

    Usa la posición NATIVA que reporta `mega_dispositivos` (firmware
    1.8.0+) — `cover.open_cover`/`close_cover`/`stop_cover` para 1, 2 y
    5 pulsaciones, y `cover.set_cover_position` directamente para 3 y 4
    (ir a 50%, ±5%). Requiere `mega_dispositivos` 1.8.0+ con el parche
    de `mega_dispositivos/lib_overrides/` instalado — en firmware más
    antiguo, `set_cover_position` no hace nada sobre estas entidades
    (`ArduinoHA` de fábrica no acepta comandos de posición) y las
    pulsaciones 3/4 no tendrán efecto, sin error visible.
  domain: automation
  input:
    boton_device_id:
      name: Pulsador (device)
      selector:
        device:
          integration: mqtt
    boton_subtype_subir:
      name: Subtype del botón de SUBIR
      description: >
        P. ej. "p22". Cópialo desde la UI al añadir el disparador
        Device para evitar errores de tecleo.
      selector:
        text: {}
    boton_subtype_bajar:
      name: Subtype del botón de BAJAR
      description: >
        P. ej. "p23". El otro botón de la pareja, el que hace la acción
        contraria sobre esta misma persiana.
      selector:
        text: {}
    cover_entity:
      name: Persiana controlada por esta pareja de botones
      selector:
        entity:
          domain: cover

mode: restart

trigger:
  # --- botón de SUBIR ---
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_short_press
    subtype: !input boton_subtype_subir
    id: p1_sube
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_double_press
    subtype: !input boton_subtype_subir
    id: p2_sube
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_triple_press
    subtype: !input boton_subtype_subir
    id: p3_sube
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_quadruple_press
    subtype: !input boton_subtype_subir
    id: p4_sube
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_quintuple_press
    subtype: !input boton_subtype_subir
    id: p5_sube
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_long_press
    subtype: !input boton_subtype_subir
    id: larga_inicio_sube
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_long_release
    subtype: !input boton_subtype_subir
    id: larga_fin_sube
  # --- botón de BAJAR ---
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_short_press
    subtype: !input boton_subtype_bajar
    id: p1_baja
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_double_press
    subtype: !input boton_subtype_bajar
    id: p2_baja
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_triple_press
    subtype: !input boton_subtype_bajar
    id: p3_baja
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_quadruple_press
    subtype: !input boton_subtype_bajar
    id: p4_baja
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_quintuple_press
    subtype: !input boton_subtype_bajar
    id: p5_baja
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_long_press
    subtype: !input boton_subtype_bajar
    id: larga_inicio_baja
  - platform: device
    domain: mqtt
    device_id: !input boton_device_id
    type: button_long_release
    subtype: !input boton_subtype_bajar
    id: larga_fin_baja

variables:
  cover_entity: !input cover_entity
  # La dirección ya no es un input: se deduce de CUÁL de los dos
  # botones ha disparado. Cada trigger lleva el sufijo _sube/_baja en
  # su id (ver el bloque trigger de arriba), así una sola instancia del
  # blueprint cubre la pareja entera de botones de esta persiana.
  direccion: "{{ 'subir' if trigger.id.endswith('_sube') else 'bajar' }}"

  objetivo_extremo: "{{ 100 if direccion == 'subir' else 0 }}"
  area_id: "{{ area_id(cover_entity) }}"
  covers_area: "{{ area_entities(area_id) | select('match', '^cover\\.') | list if area_id else [cover_entity] }}"
  covers_casa: "{{ states.cover | map(attribute='entity_id') | list }}"
  posicion_actual: "{{ state_attr(cover_entity, 'current_position') | float(0) }}"
  paso_relativo: "{{ 5 if direccion == 'subir' else -5 }}"
  objetivo_relativo: "{{ [[posicion_actual + paso_relativo, 0] | max, 100] | min }}"

action:
  - choose:
      # --- 1 pulsación: arranca hacia el extremo, o PARA si ya se
      # está moviendo (toggle). Así el mismo botón sirve para lanzar la
      # persiana y para detenerla a media altura con otro toque corto,
      # sin tener que mantener pulsado.
      #
      # Depende de que la persiana reporte "opening"/"closing" mientras
      # se mueve: mega_dispositivos lo hace desde el firmware 1.6.0+
      # (setState(StateOpening/StateClosing) al recibir el comando, y
      # vuelta a open/closed al terminar el recorrido). Si una persiana
      # NO reporta esos estados intermedios, la condición nunca se
      # cumple y el botón se comporta como antes de este cambio:
      # siempre lanza el movimiento, nunca para.
      #
      # Las pulsaciones 2/3/4/5 NO hacen toggle a propósito: son órdenes
      # de destino concreto ("ve al 50%", "+5%"), no "muévete", así que
      # tiene sentido que se apliquen también con la persiana en marcha.
      - conditions:
          - condition: trigger
            id:
              - p1_sube
              - p1_baja
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ states(cover_entity) in ['opening', 'closing'] }}
                sequence:
                  - service: cover.stop_cover
                    target:
                      entity_id: "{{ cover_entity }}"
            default:
              - service: "cover.{{ 'open_cover' if direccion == 'subir' else 'close_cover' }}"
                target:
                  entity_id: "{{ cover_entity }}"

      # --- 2 pulsaciones: todas las persianas de la misma Area, o
      # PARARLAS si alguna se está moviendo (mismo toggle que 1
      # pulsación, pero a nivel de Area).
      #
      # Criterio deliberado: basta con que UNA del Area se esté moviendo
      # para parar TODAS. Con varias persianas el estado puede ser
      # mixto (una subiendo, otra quieta), y al machacar el botón lo que
      # se espera es "para la habitación", no un toggle independiente
      # por persiana — que dejaría unas subiendo y otras paradas según
      # el instante.
      - conditions:
          - condition: trigger
            id:
              - p2_sube
              - p2_baja
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ covers_area | map('states') | select('in',
                         ['opening', 'closing']) | list | count > 0 }}
                sequence:
                  - service: cover.stop_cover
                    target:
                      entity_id: "{{ covers_area }}"
                    continue_on_error: true
            default:
              - service: "cover.{{ 'open_cover' if direccion == 'subir' else 'close_cover' }}"
                target:
                  entity_id: "{{ covers_area }}"
                continue_on_error: true

      # --- 3 pulsaciones: esta persiana al 50%.
      - conditions:
          - condition: trigger
            id:
              - p3_sube
              - p3_baja
        sequence:
          - service: cover.set_cover_position
            target:
              entity_id: "{{ cover_entity }}"
            data:
              position: 50

      # --- 4 pulsaciones: ajuste fino ±5% desde la posición actual.
      - conditions:
          - condition: trigger
            id:
              - p4_sube
              - p4_baja
        sequence:
          - service: cover.set_cover_position
            target:
              entity_id: "{{ cover_entity }}"
            data:
              position: "{{ objetivo_relativo }}"

      # --- 5 pulsaciones: TODAS las persianas de la casa.
      - conditions:
          - condition: trigger
            id:
              - p5_sube
              - p5_baja
        sequence:
          - service: "cover.{{ 'open_cover' if direccion == 'subir' else 'close_cover' }}"
            target:
              entity_id: "{{ covers_casa }}"
            continue_on_error: true

      # --- Larga: mover mientras se mantiene.
      - conditions:
          - condition: trigger
            id:
              - larga_inicio_sube
              - larga_inicio_baja
        sequence:
          - service: "cover.{{ 'open_cover' if direccion == 'subir' else 'close_cover' }}"
            target:
              entity_id: "{{ cover_entity }}"

      # --- Fin de larga: parar. El propio firmware reporta la posición
      # real alcanzada (estimada por tiempo de relé) al parar — no hace
      # falta ningún cálculo aparte aquí.
      - conditions:
          - condition: trigger
            id:
              - larga_fin_sube
              - larga_fin_baja
        sequence:
          - service: cover.stop_cover
            target:
              entity_id: "{{ cover_entity }}"
